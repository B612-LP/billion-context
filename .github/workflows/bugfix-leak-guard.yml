name: bugfix leak guard

# Dual-lane release model, fixed-branch form (2026-10-24): the standing
# `bugfix` branch must only ever contain the released base (its cut tag)
# plus small fix PRs merged into it. Master's UNRELEASED work must never
# flow onto the lane — that is the whole point of the model (a patch ship
# publishes the bugfix tree wholesale, so one leaked master merge would
# ship unreleased features). The canonical leak vector is a human running
# `git merge master` into the lane (or clicking "update branch" against a
# master-based PR): this guard inspects every merge commit on `bugfix`
# that is not yet in a release tag and alarms when any of them has a
# second parent that is an ancestor of origin/master — i.e. it merged
# master-side history into the lane. Fix PR merges never trip it: their
# second parent is the fix branch (cut from the lane, never from master).

on:
  push:
    branches: [bugfix]

concurrency:
  group: bugfix-leak-guard
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Alarm on master-side merges into the bugfix lane
        run: |
          set -euo pipefail
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*' --tags
          LEAKS=""
          for M in $(git log --merges --not --tags origin/bugfix --format='%H'); do
            P2="$(git rev-parse -q --verify "$M^2" 2>/dev/null || true)"
            [ -z "$P2" ] && continue
            if git merge-base --is-ancestor "$P2" origin/master 2>/dev/null; then
              LEAKS="${LEAKS}- merge ${M:0:12} ($(git log -1 --format='%s' "$M")) pulls master-side history into the lane"$'\n'
            fi
          done
          if [ -n "$LEAKS" ]; then
            echo "::error::master content leaked onto the bugfix lane:$LEAKS"
            echo "The lane ships wholesale on every patch release — master's unreleased work must never land here. Re-cut the lane from the latest release tag (see reference/release.md, Dual-lane releases) and re-land the fix PRs."
            exit 1
          fi
          echo "✓ no master-side merges on the bugfix lane"
